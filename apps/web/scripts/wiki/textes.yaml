# Sorts

comment-marche-un-sort:
  title: Comment marche un sort
  text: |
    Quand tu lances ton sort, tu ne frappes pas seul : toute l'armée y met sa force. L'armée donne
    la puissance, toi le talent.

    Chaque sort a sa recette : les stats dont il se sert. Plus tu es fort dans ces stats, mieux tu
    le lances. Même nul dans la bonne stat, tu en tires encore la moitié de ce que ferait un
    champion.

    Un sort fait des dégâts au monstre, soigne l'armée, ou les deux à la fois : c'est le vol de vie,
    un peu moins fort qu'un sort de dégâts.

    Certains sorts sont sûrs. D'autres frappent plus fort mais coûtent un peu de Vie à l'armée,
    dépendent de la situation, ou marchent mieux quand ta stat est basse.
  passages:
    - document: docs/game-design.md
      section: 2. Les sorts
      block: Puissance d'un sort lancé par l'armée
    - document: docs/game-design.md
      section: 2. Les sorts
      rows: [Recette, Formes, Effets, Vol de vie]
  fingerprint: "395f60bbb9e4"

degats:
  title: Dégâts
  text: |
    Ces sorts frappent le monstre.

soin:
  title: Soin
  text: |
    Ces sorts rendent de la Vie à ton armée.

vol-de-vie:
  title: Vol de vie
  text: |
    Ces sorts frappent le monstre et soignent ton armée du même coup.

# Combat

tour-de-combat:
  title: Un tour de combat
  text: |
    À chaque action de l'armée, un personnage est tiré au sort et lance son sort, avec la puissance
    de toute l'armée : c'est peut-être ton moment de gloire. Le monstre, lui, riposte. Le schéma
    montre un tour en entier.
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      rows: [Action de l'armée]
  fingerprint: "bcbcc1f02c54"

# Le schéma du tour de combat, en Mermaid, sans ses clôtures.
schema-tour-de-combat:
  text: |
    flowchart TD
        tirage["Un personnage de l'armée est tiré au sort"] --> sort["Il lance son sort avec la puissance de toute l'armée"]
        sort --> encore(["L'armée a-t-elle encore une action ce tour-ci ?"])
        encore -- oui --> tirage
        encore -- non --> monstre["Le monstre attaque l'armée"]
        monstre --> fin(["Le monstre ou l'armée n'a plus de Vie ?"])
        fin -- non --> tirage
        fin -- oui --> issue["Victoire ou défaite"]
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      rows: [Action de l'armée, Initiative, Fin]
  fingerprint: "fecddad339a2"

qui-joue:
  title: Qui joue ?
  text: |
    Chacun son tour : personne ne rejoue tant que tous les personnages de l'armée n'ont pas joué.
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      rows: [Tirage]
  fingerprint: "2d3172f921b1"

qui-joue-le-plus-souvent:
  title: Qui joue le plus souvent ?
  text: |
    C'est une course de Vitesse. Le monstre joue une fois par tour ; ton armée joue d'autant plus
    souvent qu'elle est rapide face à lui. Un peu plus rapide, elle glisse de temps en temps une
    action en plus. À égalité, c'est ton armée qui joue en premier.
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      rows: [Initiative]
  fingerprint: "be1b6012e3a1"

comment-ca-finit:
  title: Comment ça finit
  text: |
    Le combat s'arrête quand le monstre n'a plus de Vie : victoire ! Ou quand c'est ton armée :
    défaite. Pas de chrono, un combat peut durer longtemps. Et les soins ne font jamais monter ton
    armée au-dessus de sa Vie maximale.
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      rows: [Fin, Soin]
  fingerprint: "db9d9a068c73"

petite-ou-grande-armee:
  title: Petite ou grande armée
  text: |
    Que l'armée compte une poignée d'abonnés ou des milliers, un combat dure à peu près autant
    d'actions : le monstre grandit avec elle, seuls les chiffres changent. Dans une petite armée,
    tout le monde joue. Dans une immense armée, seuls quelques personnages tirés au sort deviennent
    les héros du jour.
  passages:
    - document: docs/game-design.md
      section: 4. Le combat
      block: Selon la taille de l'armée
    - document: docs/game-design.md
      section: 4. Le combat
      rows: ["10 (jour 2)", "1 000", "100 000"]
  fingerprint: "a1f8bb6d1f63"

