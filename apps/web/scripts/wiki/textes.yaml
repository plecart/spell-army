# Les textes du wiki du jeu, en mots de joueur, que le générateur recopie (`textes.ts`) : jamais de
# prose dans le code. Une entrée par clé stable, en kebab-case, avec un titre (`title`), un texte en
# Markdown (`text`), ou les deux.
#
# Une explication déclare les passages des documents qu'elle explique (`passages`) et leur empreinte
# (`fingerprint`, entre guillemets). Un passage se lit dans `document`, sous le titre `section`, de
# tout niveau : les lignes d'un tableau nommées par leur première cellule (`rows`), une puce ouverte
# par son libellé en gras (`bullet`), ou un bloc ouvert par son titre en gras (`block`). Quand un
# passage change, un test nomme l'explication à relire et donne sa nouvelle empreinte, à recopier
# une fois l'explication relue.
#
# Aucun chiffre dans un titre ou un texte : un nombre s'insère par son nom de valeur entre
# accolades, `{total des points}`, que la lecture du fichier remplace par la valeur du code. Les
# accolades sont réservées aux noms de valeur, schéma compris.

# Accueil

accueil:
  title: Spell Army
  text: |
    Spell Army, c'est l'armée de tous les abonnés de {compte Instagram}. Chaque abonné devient un
    personnage, et chaque jour, l'armée entière affronte un monstre, tour par tour. Chaque combat
    devient une vidéo où de vrais abonnés sont les héros.
  passages:
    - document: docs/etudes/00-cadrage.md
      section: 1. Ce qui est ferme
      bullet: Le concept
  fingerprint: "85e95bfffab0"

rejoindre:
  title: Rejoins l'armée
  text: |
    - Abonne-toi à {compte Instagram} : c'est tout, tu es enrôlé.
    - Ton personnage rejoint l'armée de lui-même, sans commentaire ni formulaire.
    - Va le découvrir sur {site}, et prépare-toi pour le prochain combat.
  passages:
    - document: docs/etudes/00-cadrage.md
      section: Joueurs
      rows: [Enrôlement]
  fingerprint: "2f14011b0db9"

themes:
  title: Découvre le jeu

theme-personnages:
  title: Personnages
  text: |
    Ta classe, tes stats, ton verdict et ton sort : tout ce qui fait ton personnage.

theme-sorts:
  title: Sorts
  text: |
    Comment un sort puise sa force dans toute l'armée, et tous les sorts que tu peux recevoir.

theme-combat:
  title: Combat
  text: |
    Qui joue, à quel rythme, et comment un combat se termine.

# Personnages

ton-personnage:
  title: Ton personnage
  text: |
    Chaque abonné de {compte Instagram} est un personnage de l'armée. Voici ce qui fait le tien.

ta-classe:
  title: Ta classe
  text: |
    Tu appartiens à l'une des {nombre de classes} classes, tirée au sort : chacune a autant de
    chances que les autres. Ta classe décide de ce que tes stats peuvent valoir : une Fée ne sera
    jamais costaude, un Golem jamais rapide.
  passages:
    - document: docs/game-design.md
      section: 1. Le personnage
      rows: [Classe]
  fingerprint: "03cc11c59b4d"

tes-stats:
  title: Tes stats
  text: |
    Tu as {nombre de stats} stats : Vie, Force, Magie et Vitesse, chacune jusqu'à
    {maximum d'une stat}. Elles font toujours {total des points} points en tout. Le tirage les
    répartit dans les plages de ta classe : deux Magiciens n'ont pas forcément les mêmes, et le tien
    peut être un génie… ou un raté. Va vite voir sur {site} si tu as eu de la chance !
  passages:
    - document: docs/game-design.md
      section: 1. Le personnage
      rows: [Statistiques, Total, Loterie]
  fingerprint: "8d81face092c"

ton-verdict:
  title: Ton verdict
  text: |
    Ton verdict te dit si tu es bien tombé, comparé aux autres de ta classe : mal né, faible, moyen,
    doué ou excellent. Il regarde surtout les stats où ta classe brille le plus : un Paysan doué et
    un Magicien doué n'ont donc pas du tout les mêmes stats. Les excellents sont aussi rares que les
    mal nés.
  passages:
    - document: docs/game-design.md
      section: 1. Le personnage
      rows: [Verdict]
  fingerprint: "7e043b1a54a7"

ton-sort:
  title: Ton sort
  text: |
    Tu as un seul sort, tiré au hasard, sans rapport avec ta classe : un Golem peut très bien lancer
    une boule de feu. Découvre ce que fait le tien dans [Sorts](Sorts).
  passages:
    - document: docs/game-design.md
      section: 1. Le personnage
      rows: [Sort]
  fingerprint: "08b818765402"

